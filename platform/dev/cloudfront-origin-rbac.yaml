apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-cloudfront-origin-reader
  namespace: as-bank-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - cloudfront-origin-header
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-cloudfront-origin-reader
  namespace: as-bank-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-cloudfront-origin-reader
